<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url=../pik-inc/index.html">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PIK Inc.</title>
    <meta name="description" content="PIK Inc. Redirecting to the published site.">
    <style>
      :root {
        color-scheme: dark;
        --bg: #000000;
        --panel: rgba(14, 14, 18, 0.62);
        --border: rgba(255, 255, 255, 0.18);
        --text: #ffffff;
        --muted: #a1a1aa;
        --accent: #ffffff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% -10%, rgba(255, 255, 255, 0.12), transparent 52%),
          var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: min(92vw, 580px);
        padding: 2.2rem 2.2rem 1.8rem;
        border: 1px solid var(--border);
        border-radius: 26px;
        background: var(--panel);
        backdrop-filter: blur(28px) saturate(180%) brightness(1.08);
        -webkit-backdrop-filter: blur(28px) saturate(180%) brightness(1.08);
        box-shadow:
          inset 0 1px 0.5px rgba(255, 255, 255, 0.44),
          inset 0 -0.5px 0.5px rgba(255, 255, 255, 0.12),
          0 24px 64px rgba(0, 0, 0, 0.72);
      }
      h1 {
        margin: 0 0 0.55rem;
        font-size: clamp(1.8rem, 4vw, 2.75rem);
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
      }
      a {
        color: var(--accent);
        font-weight: 500;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      a:hover { opacity: 0.85; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>PIK Inc.</h1>
      <p>
        Redirecting to the site content in <a href="../pik-inc/index.html">pik-inc</a>…
      </p>
    </main>
  </body>
</html>
